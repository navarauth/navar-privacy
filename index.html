<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 1. PAGE TITLE (shows on the browser tab and in search results) -->
<title>NavAR Privacy Policy</title>
<meta name="description" content="How NavAR collects, uses, and protects your information. NavAR is a mall navigation app by TEAM PLUS ULTRA, Cebu Technological University.">
<meta name="theme-color" content="#0b5560">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ------------------------------------------------------------
   2. COLORS AND FONT: change these few values to restyle the page
   ------------------------------------------------------------ */
:root {
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --accent: #0b5560;       /* header and links */
  --accent-soft: #d9ecee;  /* light tint for lines */
  --marker: #e0a030;       /* small route dot in the header */
  --ink: #1c2630;          /* main text */
  --muted: #55626f;        /* secondary text */
  --page: #f2f5f7;         /* page background */
  --sheet: #ffffff;        /* reading area */
  --line: #dde3e8;         /* dividers */
}

@media (prefers-color-scheme: dark) {
  :root {
    --accent: #7cc7d0;
    --accent-soft: #1f3a40;
    --marker: #f0b44a;
    --ink: #e6ebef;
    --muted: #a3afba;
    --page: #11181d;
    --sheet: #18222a;
    --line: #2b3842;
  }
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: 16px; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.65;
}

/* ------------------------------------------------------------
   3. THE HEADER (your custom title lives here)
   ------------------------------------------------------------ */
.site-header {
  background: #0b5560;
  color: #ffffff;
  padding: 44px 20px 40px;
}
.site-header-inner {
  max-width: 720px;
  margin: 0 auto;
  position: relative;
}
.site-header h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 42px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.site-header p {
  margin: 10px 0 0;
  max-width: 34em;
  color: #cfe6e9;
  font-size: 17px;
}
/* the one decorative element: a little route line */
.route {
  position: absolute;
  right: 0;
  top: 6px;
  width: 140px;
  height: 56px;
  opacity: 0.9;
}
@media (max-width: 640px) { .route { display: none; } }

/* ------------------------------------------------------------
   4. THE READING AREA
   ------------------------------------------------------------ */
main#policy {
  max-width: 720px;
  margin: 0 auto;
  padding: 36px 20px 56px;
}
@media (min-width: 760px) {
  main#policy {
    margin: -22px auto 40px;
    padding: 44px 48px 56px;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
}

/* ------------------------------------------------------------
   5. OVERRIDES FOR TERMLY'S CODE
   Termly forces its own fonts and colors with !important, so
   these rules use "#policy" in front to win. Keep them AFTER
   Termly's own <style> block.
   ------------------------------------------------------------ */

/* hide Termly's own big title, since the header above says it */
#policy h1 { display: none; }

/* body text */
#policy div,
#policy span,
#policy li,
#policy p,
#policy em,
#policy strong,
#policy u {
  font-family: var(--font) !important;
  color: var(--ink) !important;
  font-size: 17px !important;
  line-height: 1.65;
  background: transparent !important;
}
#policy [data-custom-class='body_text'],
#policy [data-custom-class='body_text'] * {
  font-family: var(--font) !important;
  color: var(--ink) !important;
  font-size: 17px !important;
}

#policy ul { padding-left: 1.3em; margin: 0.6em 0; }
#policy li { margin: 0.35em 0; }

/* section headings */
#policy h2,
#policy [data-custom-class='heading_1'],
#policy [data-custom-class='heading_1'] * {
  font-family: var(--font) !important;
  color: var(--ink) !important;
  font-size: 19px !important;
  font-weight: 700 !important;
  line-height: 1.3;
}
#policy h2 {
  margin: 2.2em 0 0.6em;
  padding-top: 0.9em;
  border-top: 2px solid var(--accent-soft);
}

/* sub headings */
#policy h3,
#policy [data-custom-class='heading_2'],
#policy [data-custom-class='heading_2'] * {
  font-family: var(--font) !important;
  color: var(--ink) !important;
  font-size: 17px !important;
  font-weight: 700 !important;
}
#policy h3 { margin: 1.6em 0 0.4em; }

/* "Last updated" line */
#policy [data-custom-class='subtitle'],
#policy [data-custom-class='subtitle'] * {
  font-family: var(--font) !important;
  color: var(--muted) !important;
  font-size: 15px !important;
}

/* links, including the table of contents */
#policy a,
#policy a *,
#policy [data-custom-class='link'],
#policy [data-custom-class='link'] * {
  font-family: var(--font) !important;
  color: var(--accent) !important;
  font-size: 17px !important;
  text-decoration: underline;
  text-underline-offset: 3px;
  word-break: break-word;
}
#policy a:hover { text-decoration-thickness: 2px; }
#policy a:focus-visible {
  outline: 3px solid var(--marker);
  outline-offset: 2px;
  border-radius: 2px;
}

/* Termly's small logo at the top: kept, but quieter */
#policy > span:first-of-type {
  width: 7.5rem !important;
  height: 1.6rem !important;
  margin: 0 0 1.5rem !important;
  background-size: contain !important;
  opacity: 0.55;
}

/* ------------------------------------------------------------
   6. FOOTER
   ------------------------------------------------------------ */
.site-footer {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px 48px;
  color: var(--muted);
  font-size: 15px;
}

@media print {
  .site-header { background: none; color: #000; padding: 0 0 12px; }
  .site-header p { color: #333; }
  .route { display: none; }
  main#policy { border: 0; margin: 0; padding: 0; }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="site-header-inner">
    <!-- change this title and line to whatever you like -->
    <h1>NavAR Privacy Policy</h1>
    <p>How NavAR collects, uses, and protects your information.</p>

    <svg class="route" viewBox="0 0 140 56" aria-hidden="true" focusable="false">
      <path d="M6 46 C 34 46, 40 12, 70 12 S 108 44, 134 18" fill="none" stroke="#7cc7d0" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
      <circle cx="6" cy="46" r="5" fill="#ffffff"/>
      <circle cx="134" cy="18" r="6" fill="#e0a030"/>
    </svg>
  </div>
</header>

<main id="policy">

<!-- ============================================================
     PASTE YOUR TERMLY CODE HERE
     Copy everything Termly gave you (it starts with <style> and
     ends with the "created using Termly" line) and paste it
     in place of this comment.
     ============================================================ -->

</main>

<footer class="site-footer">
  NavAR is a capstone project by TEAM PLUS ULTRA, Cebu Technological University.
</footer>

</body>
</html>
